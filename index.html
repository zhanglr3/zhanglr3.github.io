<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A personal portfolio: background, selected projects, and interests.">
<title>Linru Zhang — Personal Website</title>
<style>
* { box-sizing: border-box; }
html { scroll-padding-top: 24px; }
body { margin: 0; background: #fff; color: #222; font: 16px/1.75 Arial, sans-serif; }
a { color: #333; text-underline-offset: 3px; }
a:hover { color: #000; }
a:focus-visible { outline: 2px solid #555; outline-offset: 4px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 28px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 28px 0; border-bottom: 1px solid #ddd; }
.brand { font-size: 18px; font-weight: bold; text-decoration: none; }
nav { display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px; }
.hero { padding: 54px 0 38px; }
h1 { margin: 0 0 20px; font-size: 34px; line-height: 1.3; font-weight: 600; }
h1 em { font-style: normal; }
.intro { max-width: 600px; color: #555; }
.button { display: inline-block; margin-top: 6px; }
section { border-top: 1px solid #ddd; padding: 32px 0; }
h2 { font-size: 22px; line-height: 1.4; margin: 0 0 18px; font-weight: 600; }
h3 { font-size: 17px; margin: 0 0 6px; font-weight: 600; }
p { margin: 0 0 16px; }
.muted, .project p { color: #555; }
.tags { display: flex; flex-wrap: wrap; gap: 8px 20px; color: #555; font-size: 14px; }
.project { margin: 24px 0; }
.project:last-child { margin-bottom: 0; }
.project p { margin-bottom: 4px; }
.project small { color: #666; font-size: 13px; }
.placeholder { overflow-wrap: anywhere; }
footer { border-top: 1px solid #ddd; padding: 24px 0 36px; color: #666; font-size: 13px; }
.skip { position: absolute; top: -80px; left: 20px; background: white; padding: 10px; }
.skip:focus { top: 10px; }
@media (max-width: 480px) {
 .wrap { padding: 0 20px; }
 header { align-items: flex-start; flex-direction: column; gap: 12px; }
 .hero { padding-top: 36px; }
 h1 { font-size: 29px; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
<header><a class="brand" href="#">Linru Zhang.</a><nav aria-label="Main navigation"><a href="#about">About</a><a href="#projects">Projects</a><a href="#contact">Contact</a></nav></header>
<main id="main">
<div class="hero"><div><h1>Hello, I'm Linru Zhang.</h1><p class="intro">Welcome to my homepage.</div></div>
<section id="about" class="section-grid"><div><h2>About me</h2></div><div><p class="body-copy">[coming soon]</p></div></div></section>
</main>
<footer><span>© Linru Zhang. Personal website.</span></footer>
</div>
</body>
</html>
